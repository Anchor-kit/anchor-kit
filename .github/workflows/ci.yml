name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anchor
          POSTGRES_PASSWORD: anchor
          POSTGRES_DB: anchor_kit_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anchor -d anchor_kit_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format Check
        run: bun run format:check

      - name: Type Check
        run: bun run typecheck

      - name: Fallow Health
        run: bun run scripts/check-fallow-health.mjs

      - name: Run Tests with Coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Node PostgreSQL package smoke test
        run: bun run smoke:node-postgres
        env:
          DATABASE_URL: postgres://anchor:anchor@127.0.0.1:5432/anchor_kit_smoke

name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

env:
  BUN_VERSION: 1.1.38

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format Check
        run: bun run format:check

      - name: Type Check
        run: bun run typecheck

      - name: Fallow Health
        run: bun run scripts/check-fallow-health.mjs

      - name: Run Tests with Coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Smoke Test (pinned Bun)
        run: |
          bun --version | grep -q "^${{ env.BUN_VERSION }}" || { echo "Bun version mismatch"; exit 1; }
          bun run scripts/smoke-tarball.mjs

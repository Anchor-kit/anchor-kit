name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format Check
        run: bun run format:check

      - name: Type Check
        run: bun run typecheck

      - name: Fallow Health
        run: bun run scripts/check-fallow-health.mjs

      - name: Run Tests with Coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Pack tarball
        run: bun pm pack --destination ./packed

      - name: Install and run Bun consumer fixture
        run: |
          set -euo pipefail
          TARBALL="$(ls ./packed/*.tgz | head -n 1)"
          FIXTURE_DIR="$(mktemp -d)"
          cp -R fixtures/consumer-bun/. "$FIXTURE_DIR/"
          cd "$FIXTURE_DIR"
          bun add "$GITHUB_WORKSPACE/$TARBALL"
          bun run check

      - name: Install and run Node consumer fixture
        run: |
          set -euo pipefail
          TARBALL="$(ls ./packed/*.tgz | head -n 1)"
          FIXTURE_DIR="$(mktemp -d)"
          cp -R fixtures/consumer-node/. "$FIXTURE_DIR/"
          cd "$FIXTURE_DIR"
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          npm run check
          npx tsc --noEmit
